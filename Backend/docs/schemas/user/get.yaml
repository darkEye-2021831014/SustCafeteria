summary: Get all users (ADMIN only)
tags:
  - User
responses:
  "200":
    description: List of all users
    content:
      application/json:
        schema:
          type: object
          properties:
            users:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: 123
                  name:
                    type: string
                    example: John Doe
                  email:
                    type: string
                    example: john@example.com
                  role:
                    type: string
                    example: ADMIN
  "401":
    description: Unauthorized (not ADMIN)
    content:
      application/json:
        schema:
          type: object
          properties:
            msg:
              type: string
              example: Unauthorized
