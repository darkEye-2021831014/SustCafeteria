summary: Get inventory item by ID
tags:
  - Inventory
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    example: 1
responses:
  "200":
    description: Inventory item details
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Rice"
            category:
              type: string
              example: "Grains"
            unit:
              type: string
              example: "kg"
            minimum_stock:
              type: number
              format: float
              example: 10.0
            current_stock:
              type: number
              format: float
              example: 50.0
            status:
              type: string
              example: "Available"
  "404":
    description: Item not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Item not found"
  "500":
    description: Server error