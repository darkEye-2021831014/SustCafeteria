summary: Create a new menu item
tags:
  - Menu

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - price
        properties:
          name:
            type: string
            example: Burger
          price:
            type: number
            example: 120
          category:
            type: string
            example: Lunch
          image:
            type: string
            example: https://res.cloudinary.com/demo/image/upload/v123456/burger.jpg

responses:
  "201":
    description: Item created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            message:
              type: string
              example: Item created successfully
            data:
              type: object
              properties:
                insertId:
                  type: integer
                  example: 1

  "400":
    description: Invalid input or missing required fields
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: false
            message:
              type: string
              example: Name, price and category are required

  "500":
    description: Server error
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: false
            message:
              type: string
              example: Internal server error
