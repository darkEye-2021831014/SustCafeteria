summary: Create a new order
tags:
  - Order

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - items
        properties:
          items:
            type: array
            items:
              type: object
              required:
                - menu_item_id
                - unit_price
                - quantity
              properties:
                menu_item_id:
                  type: integer
                  example: 1
                unit_price:
                  type: number
                  example: 120
                quantity:
                  type: integer
                  example: 2
          discount:
            type: number
            example: 10

responses:
  "201":
    description: Order created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            orderId:
              type: integer
              example: 5
            subtotal:
              type: number
              example: 240
            discount:
              type: number
              example: 10
            total:
              type: number
              example: 216

  "400":
    description: Invalid request data
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: Items are required and should be an array

  "500":
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: Internal server error
