summary: Get total sales by date range
tags:
  - Sales Report
security:
  - cookieAuth: []
parameters:
  - in: query
    name: start
    required: true
    schema:
      type: string
      format: date
    example: "2026-05-01"
    description: Start date (YYYY-MM-DD)
  - in: query
    name: end
    required: true
    schema:
      type: string
      format: date
    example: "2026-05-31"
    description: End date (YYYY-MM-DD)
responses:
  "200":
    description: Total sales fetched successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            total_sales:
              type: number
              format: float
              example: 245000
  "403":
    description: Unauthorized
  "500":
    description: Server error
