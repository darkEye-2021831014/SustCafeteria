summary: Get sales report by date range
tags:
  - Sales Report
security:
  - cookieAuth: []
parameters:
  - in: query
    name: start
    required: true
    schema:
      type: string
      format: date
    example: "2026-05-01"
    description: Start date (YYYY-MM-DD)
  - in: query
    name: end
    required: true
    schema:
      type: string
      format: date
    example: "2026-05-31"
    description: End date (YYYY-MM-DD)
responses:
  "200":
    description: Sales report fetched successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
            data:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: string
                    example: "Chicken Burger"
                  total_quantity:
                    type: integer
                    example: 120
                  unit_price:
                    type: number
                    format: float
                    example: 85.5
                  total_sales:
                    type: number
                    format: float
                    example: 10260
  "400":
    description: Missing start or end query parameter
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Start and end date required"
  "403":
    description: Unauthorized
  "500":
    description: Server error
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Server error"
