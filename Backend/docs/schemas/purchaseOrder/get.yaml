summary: Get all purchase orders
description: Retrieve all purchase orders with item and supplier details
tags:
  - Purchase Order
security:
  - cookieAuth: []
responses:
  '200':
    description: List of all purchase orders
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              stock_item_id:
                type: integer
              supplier_id:
                type: integer
              order_quantity:
                type: integer
              expected_delivery:
                type: string
                format: date
              status:
                type: string
                enum: [PENDING, DELIVERED]
              created_at:
                type: string
                format: date-time
              item_name:
                type: string
              unit:
                type: string
              supplier_name:
                type: string
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            msg:
              type: string