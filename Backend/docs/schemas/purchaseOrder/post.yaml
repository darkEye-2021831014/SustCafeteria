summary: Create a purchase order
description: Create a new purchase order for a stock item from a supplier
tags:
  - Purchase Order
security:
  - cookieAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - stock_item_id
          - supplier_id
          - order_quantity
          - expected_delivery
        properties:
          stock_item_id:
            type: integer
            description: ID of the stock item to order
          supplier_id:
            type: integer
            description: ID of the supplier
          order_quantity:
            type: integer
            description: Quantity to order
          expected_delivery:
            type: string
            format: date
            description: Expected delivery date (YYYY-MM-DD)
responses:
  '201':
    description: Purchase order created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            msg:
              type: string
              example: "Purchase order created"
            id:
              type: integer
              description: ID of the created purchase order
  '400':
    description: Missing required fields
    content:
      application/json:
        schema:
          type: object
          properties:
            msg:
              type: string
              example: "Missing required fields: stock_item_id, supplier_id, order_quantity, expected_delivery"
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            msg:
              type: string