summary: Get a staff member by ID
tags:
  - Staff

security:
  - cookieAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: integer
    description: Staff ID

responses:
  "200":
    description: Staff retrieved successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              example: 1

            name:
              type: string
              example: Rahim

            role:
              type: string
              example: Cook

            salary:
              type: integer
              example: 15000

            phone:
              type: string
              example: "017xxxxxxxx"

            email:
              type: string
              example: rahim@gmail.com

            address:
              type: string
              example: Sylhet

            join_date:
              type: string
              format: date
              example: "2026-03-12"

            image:
              type: string
              example: rahim.jpg

  "404":
    description: Staff not found