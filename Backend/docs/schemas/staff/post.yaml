summary: Create a new staff member
tags:
  - Staff

security:
  - cookieAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - role
          - salary
          - email
        properties:
          name:
            type: string
            example: Rahim

          role:
            type: string
            example: Cook

          salary:
            type: integer
            example: 15000

          phone:
            type: string
            example: "017xxxxxxxx"

          email:
            type: string
            example: rahim@gmail.com

          address:
            type: string
            example: Sylhet

          join_date:
            type: string
            format: date
            example: "2026-03-12"

          image:
            type: string
            format: binary

responses:
  "201":
    description: Staff created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Staff created successfully

            result:
              type: integer
              example: 5

  "400":
    description: Invalid input

  "401":
    description: Unauthorized

  "500":
    description: Internal server error