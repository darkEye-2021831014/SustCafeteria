summary: Get all staff members
tags:
  - Staff

security:
  - cookieAuth: []

responses:
  "200":
    description: List of all staff
    content:
      application/json:
        schema:
          type: object
          properties:
            staffs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1

                  name:
                    type: string
                    example: Rahim

                  role:
                    type: string
                    example: Cook

                  salary:
                    type: integer
                    example: 15000

                  phone:
                    type: string
                    example: "017xxxxxxxx"

                  email:
                    type: string
                    example: rahim@gmail.com

                  address:
                    type: string
                    example: Sylhet

                  join_date:
                    type: string
                    format: date
                    example: "2026-03-12"

                  image:
                    type: string
                    example: rahim.jpg

  "401":
    description: Unauthorized