summary: Update inventory item quantity
tags:
  - Inventory
security:
  - cookieAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    example: 1
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - quantity
        properties:
          quantity:
            type: number
            format: float
            example: 60.0
responses:
  "200":
    description: Quantity updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Stock updated successfully"
  "400":
    description: Bad request
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Stock cannot be negative"
  "403":
    description: Unauthorized
  "500":
    description: Server error