summary: Delete inventory item
tags:
  - Inventory
security:
  - cookieAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    example: 1
responses:
  "200":
    description: Item deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Item deleted successfully"
  "403":
    description: Unauthorized
  "500":
    description: Server error